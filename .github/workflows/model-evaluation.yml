name: Real embedding model smoke evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    env:
      RUN_INTEGRATION: '1'
      RUN_MODEL_TESTS: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install uv==0.12.22
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest -m model
