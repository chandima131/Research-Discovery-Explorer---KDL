[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-discovery-explorer"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2", "starlette==1.7.0", "uvicorn==0.34.2", "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.40", "psycopg[binary]==3.2.9", "pgvector==0.4.1",
  "alembic==1.15.2", "sentence-transformers==5.6.0", "transformers==5.18.0",
  "torch==2.14.1", "setuptools==84.0.0"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.11.8", "mypy==1.15.0", "pip-audit==2.9.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = ["integration: requires PostgreSQL with pgvector", "model: downloads and tests the real embedding model"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["app/tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
